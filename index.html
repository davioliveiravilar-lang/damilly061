<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nossa História - 4 Anos</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
    
    <!-- FontAwesome (Icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Audio Player Discreto -->
    <div class="audio-control" id="audio-control" style="display: none;">
        <button id="toggle-music" title="Tocar/Pausar Música">
            <i class="fas fa-music"></i>
        </button>
        <audio id="background-music" loop>
            <!-- O source será injetado pelo JS -->
        </audio>
    </div>

    <!-- Indicador de Progresso (Scroll) -->
    <div class="progress-container">
        <div class="progress-bar" id="myBar"></div>
    </div>

    <nav class="side-nav" id="side-nav">
        <!-- Navegação gerada dinamicamente -->
    </nav>

    <!-- App Container -->
    <main id="app">
        <!-- O conteúdo será injetado aqui via script.js -->
    </main>

    <!-- Modal para Fotos em Tela Cheia -->
    <div id="photo-modal" class="modal">
        <span class="close-modal">&times;</span>
        <img class="modal-content" id="modal-img">
    </div>

    <!-- Scripts -->
    <script src="data.js"></script>
    <script src="script.js"></script>

</body>
</html>
